name: Clone proof
description: Share a successful clone-doctor run on real hardware or a fresh VM.
title: "Clone proof: "
labels: ["clone-proof"]
body:
  - type: markdown
    attributes:
      value: |
        A clean run matters. It proves which machines and operating systems can
        run Seed's first checks without private setup.

        Run:

        ```bash
        bash tools/clone-doctor.sh 2>&1 \
          | python3 tools/redact-report.py \
          | python3 tools/share-proof.py --issue-fields
        ```

        That prints paste-ready values for the fields below.
        Examples: docs/CLONE_PROOF_EXAMPLES.md
  - type: input
    id: machine
    attributes:
      label: Machine
      description: Hardware or VM type, CPU architecture, and RAM.
      placeholder: "Raspberry Pi Zero 2W, arm64, 512MB RAM"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Distribution and version.
      placeholder: "Raspberry Pi OS Lite 64-bit, Debian 12"
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend tested
      description: Which backend or setup path did you try, if any?
      placeholder: "clone-doctor only, Codex, Claude, Gemini, none yet"
    validations:
      required: false
  - type: textarea
    id: proof
    attributes:
      label: Shareable proof
      description: Paste the short proof note from tools/share-proof.py.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything surprising, slow, confusing, or machine-specific.
    validations:
      required: false
